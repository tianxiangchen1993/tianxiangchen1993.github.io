name: Update Google Scholar Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/google_scholar_crawler.yaml'
      - 'google_scholar_crawler/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install requirements
        working-directory: google_scholar_crawler
        run: pip install -r requirements.txt

      - name: Fetch Google Scholar metrics
        working-directory: google_scholar_crawler
        env:
          GOOGLE_SCHOLAR_ID: _Gdrw7UAAAAJ
        run: python main.py

      - name: Publish metrics branch
        working-directory: google_scholar_crawler/results
        run: |
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json
          git commit -m "Update Google Scholar metrics"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats --force
