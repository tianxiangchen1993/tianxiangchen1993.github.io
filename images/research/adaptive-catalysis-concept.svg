<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive catalysis conceptual framework</title>
  <desc id="desc">A four-stage framework from precise precursor design through controlled reconstruction and a dynamic working-state ensemble to catalytic function, recovery, or deactivation, supported by an evidence loop.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A0019"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#c8cdd3;stroke-width:1.5}
      .box2{fill:#f7f8fa;stroke:#d9dde2;stroke-width:1.2}
      .title{font:700 21px Arial,Helvetica,sans-serif;fill:#20252b}
      .label{font:700 16px Arial,Helvetica,sans-serif;fill:#20252b}
      .small{font:400 13px Arial,Helvetica,sans-serif;fill:#4b5560}
      .tiny{font:600 12px Arial,Helvetica,sans-serif;fill:#59636e}
      .accent{fill:#7A0019}
      .accentStroke{stroke:#7A0019;stroke-width:2.5;fill:none}
      .teal{fill:#1f7a78}
      .tealStroke{stroke:#1f7a78;stroke-width:2.2;fill:none}
      .gold{fill:#c69214}
      .muted{fill:#e8ebef}
    </style>
  </defs>

  <text x="700" y="36" text-anchor="middle" class="title">Adaptive Catalysis: from designed precursors to working-state ensembles</text>

  <!-- Stage 1 -->
  <rect x="35" y="75" rx="18" ry="18" width="280" height="245" class="box"/>
  <text x="175" y="108" text-anchor="middle" class="label">1. Precise Precursor Design</text>
  <text x="175" y="132" text-anchor="middle" class="small">nuclearity • composition • confinement</text>
  <path d="M90 210 L125 170 L170 190 L215 165 L255 205 L225 250 L180 270 L130 250 Z" fill="#f3f4f6" stroke="#aab2bb" stroke-width="2"/>
  <circle cx="145" cy="215" r="15" class="accent"/>
  <circle cx="178" cy="205" r="15" class="accent"/>
  <circle cx="211" cy="218" r="15" class="accent"/>
  <line x1="160" y1="212" x2="163" y2="209" class="accentStroke"/>
  <line x1="193" y1="210" x2="196" y2="213" class="accentStroke"/>
  <text x="175" y="300" text-anchor="middle" class="tiny">structurally constrained starting state</text>

  <!-- Arrow 1 -->
  <line x1="320" y1="198" x2="365" y2="198" class="accentStroke" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <rect x="375" y="75" rx="18" ry="18" width="280" height="245" class="box"/>
  <text x="515" y="108" text-anchor="middle" class="label">2. Controlled Reconstruction</text>
  <text x="515" y="132" text-anchor="middle" class="small">reaction environment perturbs the site</text>
  <circle cx="490" cy="212" r="15" class="accent"/>
  <circle cx="530" cy="192" r="15" class="accent"/>
  <circle cx="545" cy="232" r="15" class="accent"/>
  <path d="M445 175 C420 195 420 230 447 248" class="tealStroke" marker-end="url(#arrow)"/>
  <path d="M580 176 C610 195 610 230 581 249" class="tealStroke" marker-end="url(#arrow)"/>
  <text x="515" y="276" text-anchor="middle" class="tiny">reactants • H2O • heat • redox • cycling</text>
  <text x="515" y="300" text-anchor="middle" class="tiny">migration • coordination change • nuclearity change</text>

  <!-- Arrow 2 -->
  <line x1="660" y1="198" x2="705" y2="198" class="accentStroke" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <rect x="715" y="75" rx="18" ry="18" width="280" height="245" class="box"/>
  <text x="855" y="108" text-anchor="middle" class="label">3. Dynamic Working-State Ensemble</text>
  <text x="855" y="132" text-anchor="middle" class="small">multiple interconverting structural states</text>
  <rect x="758" y="164" width="82" height="80" rx="12" class="box2"/>
  <circle cx="785" cy="205" r="12" class="accent"/>
  <circle cx="813" cy="205" r="12" class="accent"/>
  <rect x="870" y="164" width="82" height="80" rx="12" class="box2"/>
  <circle cx="894" cy="193" r="11" class="accent"/>
  <circle cx="923" cy="214" r="11" class="accent"/>
  <circle cx="898" cy="226" r="11" class="teal"/>
  <path d="M837 203 C850 188 858 188 871 203" class="tealStroke" marker-end="url(#arrow)"/>
  <path d="M872 222 C858 238 850 238 838 224" class="tealStroke" marker-end="url(#arrow)"/>
  <text x="855" y="276" text-anchor="middle" class="tiny">population shifts with chemical potential and time</text>
  <text x="855" y="300" text-anchor="middle" class="tiny">the working catalyst ≠ the ex situ precursor</text>

  <!-- Arrow 3 -->
  <line x1="1000" y1="198" x2="1045" y2="198" class="accentStroke" marker-end="url(#arrow)"/>

  <!-- Stage 4 -->
  <rect x="1055" y="75" rx="18" ry="18" width="310" height="245" class="box"/>
  <text x="1210" y="108" text-anchor="middle" class="label">4. Function and Fate</text>
  <text x="1210" y="132" text-anchor="middle" class="small">structure determines catalytic outcome</text>
  <rect x="1090" y="165" width="240" height="55" rx="12" fill="#eef7f6" stroke="#9fc8c5" stroke-width="1.3"/>
  <circle cx="1117" cy="192" r="8" class="teal"/>
  <text x="1140" y="187" class="tiny">productive adaptation</text>
  <text x="1140" y="205" class="small">activity • selectivity • recovery</text>
  <rect x="1090" y="235" width="240" height="55" rx="12" fill="#fbf3f4" stroke="#d6a7b1" stroke-width="1.3"/>
  <circle cx="1117" cy="262" r="8" class="accent"/>
  <text x="1140" y="257" class="tiny">irreversible deactivation</text>
  <text x="1140" y="275" class="small">aggregation • migration • host damage</text>

  <!-- Evidence loop -->
  <rect x="90" y="365" rx="18" ry="18" width="1220" height="66" fill="#f7f8fa" stroke="#d9dde2" stroke-width="1.2"/>
  <text x="700" y="390" text-anchor="middle" class="label">Evidence loop</text>
  <text x="700" y="414" text-anchor="middle" class="small">operando / time-resolved observation → competing hypotheses → controls and falsification → causal structure–function relation → redesign</text>
  <path d="M1195 347 C1195 337 1185 330 1172 330 L210 330 C195 330 185 339 185 349" class="tealStroke" marker-end="url(#arrow)"/>
</svg>